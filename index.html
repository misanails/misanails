<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Khách Hẹn AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #fcf9f5; padding: 20px 15px; color: #333; }
    .container { max-width: 650px; margin: 0 auto; }
    
    /* THANH CHUYỂN TAB ĐẸP MẮT */
    .tab-navigation { display: flex; background: #efe6db; padding: 4px; border-radius: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; font-size: 14px; font-weight: 700; color: #776e65; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #fff; color: #a82e43; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    
    /* CARD KHU VỰC NỘI DUNG */
    .card { background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #f0e2d3; }
    h2 { font-size: 20px; font-weight: 700; color: #2a2017; margin-bottom: 20px; }
    
    /* TAB 1: GIAO DIỆN AI THÊM HẸN (CHUẨN GỐC) */
    .ai-box { background-color: #f7ede1; border: 1px dashed #d8b88d; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    .ai-title { font-size: 11px; font-weight: 800; color: #a37233; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; display: block; }
    .ai-textarea { width: 100%; padding: 12px; border: 1px solid #e0ceb5; border-radius: 6px; font-size: 14px; background: #fff; outline: none; resize: none; }
    .btn-ai { width: 100%; background: #c59b27; color: #fff; border: none; padding: 13px; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-ai:hover { background: #b0881e; }
    
    .form-group { margin-bottom: 18px; }
    .form-row { display: flex; gap: 16px; }
    .form-col { flex: 1; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #e8e2da; border-radius: 6px; font-size: 14px; outline: none; background: #fff; }
    input:focus { border-color: #c59b27; }

    .toast { display: none; background: #222; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; text-align: center; margin-bottom: 16px; float: right; }
    .actions { display: flex; gap: 14px; margin-top: 24px; clear: both; }
    .btn-cancel { flex: 1; background: #fff; border: 1px solid #dcd3c9; padding: 13px; border-radius: 6px; cursor: pointer; font-weight: bold; color: #555; text-align: center; }
    .btn-submit { flex: 1; background: #a82e43; color: #fff; border: none; padding: 13px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; }

    /* TAB 2: GIAO DIỆN XEM LẠI LỊCH HẸN */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .search-box { margin-bottom: 16px; }
    .search-box input { width: 100%; padding: 10px 14px; border: 1px solid #e8e2da; border-radius: 8px; font-size: 14px; }

    .appointment-item { background: #faf8f5; border: 1px solid #eae2d8; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .appt-time { background: #c59b27; color: #fff; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
    .appt-info h4 { font-size: 15px; color: #2a2017; margin-bottom: 4px; font-weight: 700; }
    .appt-info p { font-size: 13px; color: #666; margin-bottom: 2px; }
    .btn-delete { background: transparent; border: 1px solid #e2b6b6; color: #c53030; font-size: 12px; cursor: pointer; font-weight: 600; padding: 6px 12px; border-radius: 6px; }
    .btn-delete:hover { background: #fff0f0; }
    .empty-msg { text-align: center; color: #999; font-size: 14px; padding: 30px 0; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- THANH CHUYỂN TAB -->
  <div class="tab-navigation">
    <button class="tab-btn active" onclick="switchTab('tab-create')">➕ Thêm Khách Hẹn</button>
    <button class="tab-btn" onclick="switchTab('tab-list')">📅 Xem Lịch Hẹn (<span id="count-badge">0</span>)</button>
  </div>

  <!-- TAB 1: FORM THÊM HẸN AI -->
  <div id="tab-create" class="tab-content active">
    <div class="card">
      <h2>Thêm khách hẹn</h2>

      <div class="ai-box">
        <span class="ai-title">✨ NÓI CẢ CÂU HOẶC GÕ ĐỂ AI TỰ ĐIỀN Ô:</span>
        <textarea id="ai-input" class="ai-textarea" rows="2" placeholder="bin 0909090 hen 11h20 chan nước"></textarea>
        <button type="button" class="btn-ai" onclick="handleSmartAnalysis()">✨ AI Phân Tích & Tự Điền Ô</button>
      </div>

      <form id="booking-form" onsubmit="saveAppointment(event)">
        <div class="form-group">
          <label>Tên khách</label>
          <input type="text" id="input-name" placeholder="...">
        </div>

        <div class="form-group">
          <label>Số điện thoại</label>
          <input type="text" id="input-phone" placeholder="...">
        </div>

        <div class="form-row form-group">
          <div class="form-col">
            <label>Ngày</label>
            <input type="date" id="input-date">
          </div>
          <div class="form-col">
            <label>Giờ</label>
            <input type="time" id="input-time">
          </div>
        </div>

        <div class="form-group">
          <label>Dịch vụ</label>
          <input type="text" id="input-service" placeholder="...">
        </div>

        <div class="form-group">
          <label>Ghi chú</label>
          <input type="text" id="input-note" placeholder="...">
        </div>

        <div id="toast-msg" class="toast">✨ AI đã phân tích và điền xong!</div>

        <div class="actions">
          <button type="button" class="btn-cancel" onclick="resetForm()">Huỷ</button>
          <button type="submit" class="btn-submit">Lưu Lịch Hẹn</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TAB 2: XEM LẠI DANH SÁCH LỊCH HẸN -->
  <div id="tab-list" class="tab-content">
    <div class="card">
      <h2>Danh sách lịch hẹn đã lưu</h2>
      
      <div class="search-box">
        <input type="text" id="search-input" placeholder="🔍 Tìm theo Tên hoặc Số điện thoại..." oninput="renderAppointments()">
      </div>

      <div id="appointment-list">
        <!-- Lịch hẹn sẽ tự động hiện ra ở đây -->
      </div>
    </div>
  </div>

</div>

<script>
// --- 1. CHUYỂN ĐỔI TAB ---
function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  
  document.getElementById(tabId).classList.add('active');
  event.currentTarget.classList.add('active');

  if (tabId === 'tab-list') {
    renderAppointments();
  }
}

// --- 2. AI PHÂN TÍCH TỰ ĐỘNG ---
function handleSmartAnalysis() {
  const text = document.getElementById('ai-input').value.trim();
  if (!text) return;

  const result = { name: '', phone: '', time: '', service: '' };
  let raw = text;

  // Tách SĐT
  const phoneMatch = raw.match(/(0\d{5,10})/);
  if (phoneMatch) { result.phone = phoneMatch[0]; raw = raw.replace(result.phone, ''); }

  // Tách Giờ
  const timeMatch = raw.match(/(\d{1,2}(?:[:h]\d{2}|h)?)/i);
  if (timeMatch) {
    let t = timeMatch[0].toLowerCase().replace('h', ':');
    if (!t.includes(':')) t += ':00';
    const parts = t.split(':');
    result.time = `${parts[0].padStart(2, '0')}:${(parts[1] || '00').padStart(2, '0')}`;
    raw = raw.replace(timeMatch[0], '');
  }

  // Tách Tên & Dịch vụ
  let clean = raw.replace(/(hen|hẹn|đặt|dat|lịch|lich|lúc|luc)/gi, '').replace(/\s+/g, ' ').trim();
  const words = clean.split(' ');
  if (words.length > 0) {
    result.name = words[0];
    result.service = words.slice(1).join(' ');
  }

  // Điền vào Form
  const fill = (id, val) => {
    if (!val) return;
    const el = document.getElementById(id);
    if (el) { el.value = val; el.dispatchEvent(new Event('input', { bubbles: true })); }
  };

  fill('input-name', result.name);
  fill('input-phone', result.phone);
  fill('input-time', result.time);
  fill('input-service', result.service);

  const dateEl = document.getElementById('input-date');
  if (dateEl && !dateEl.value) dateEl.value = new Date().toISOString().split('T')[0];

  const toast = document.getElementById('toast-msg');
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 2000);
}

// --- 3. LƯU VÀ QUẢN LÝ LỊCH HẸN (LOCALSTORAGE) ---
function getAppointments() {
  return JSON.parse(localStorage.getItem('saved_appointments') || '[]');
}

function saveAppointment(event) {
  event.preventDefault();

  const newAppt = {
    id: Date.now(),
    name: document.getElementById('input-name').value || 'Khách không tên',
    phone: document.getElementById('input-phone').value || 'Không có SĐT',
    date: document.getElementById('input-date').value || new Date().toISOString().split('T')[0],
    time: document.getElementById('input-time').value || '--:--',
    service: document.getElementById('input-service').value || 'Dịch vụ chung',
    note: document.getElementById('input-note').value || ''
  };

  const list = getAppointments();
  list.unshift(newAppt); // Lưu mới nhất lên trên
  localStorage.setItem('saved_appointments', JSON.stringify(list));

  resetForm();
  updateBadge();
  
  // Tự chuyển sang Tab Lịch Hẹn để người dùng xem kết quả ngay
  alert('✅ Đã lưu thành công!');
  switchTab('tab-list');
  document.querySelectorAll('.tab-btn')[1].classList.add('active');
  document.querySelectorAll('.tab-btn')[0].classList.remove('active');
}

function deleteAppointment(id) {
  if (confirm('Bạn có chắc muốn xoá lịch hẹn này?')) {
    let list = getAppointments().filter(item => item.id !== id);
    localStorage.setItem('saved_appointments', JSON.stringify(list));
    renderAppointments();
    updateBadge();
  }
}

function resetForm() {
  document.getElementById('booking-form').reset();
  document.getElementById('ai-input').value = '';
}

function updateBadge() {
  document.getElementById('count-badge').innerText = getAppointments().length;
}

// --- 4. HIỂN THỊ DANH SÁCH LỊCH HẸN ---
function renderAppointments() {
  const list = getAppointments();
  const searchKeyword = (document.getElementById('search-input')?.value || '').toLowerCase();
  const container = document.getElementById('appointment-list');

  const filteredList = list.filter(item => 
    item.name.toLowerCase().includes(searchKeyword) || 
    item.phone.includes(searchKeyword)
  );

  if (filteredList.length === 0) {
    container.innerHTML = '<div class="empty-msg">Chưa có lịch hẹn nào được lưu.</div>';
    return;
  }

  container.innerHTML = filteredList.map(item => `
    <div class="appointment-item">
      <div class="appt-info">
        <span class="appt-time">⏰ ${item.time} - Ngày: ${item.date}</span>
        <h4>👤 ${item.name} - 📞 ${item.phone}</h4>
        <p>💅 <strong>Dịch vụ:</strong> ${item.service}</p>
        ${item.note ? `<p>📝 <strong>Ghi chú:</strong> ${item.note}</p>` : ''}
      </div>
      <button class="btn-delete" onclick="deleteAppointment(${item.id})">Xoá</button>
    </div>
  `).join('');
}

// Khởi chạy ban đầu
window.onload = () => {
  updateBadge();
};
</script>

</body>
</html>
