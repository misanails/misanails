<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thêm Khách Hẹn - AI Tự Động Nhận Diện</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f7f4f0; padding: 20px; color: #333; }
    .card { max-width: 650px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { font-size: 20px; font-weight: 700; color: #222; margin-bottom: 16px; }
    
    /* Vùng AI */
    .ai-box { background-color: #f5e9d6; border: 1px dashed #c8a36e; border-radius: 8px; padding: 14px; margin-bottom: 20px; }
    .ai-title { font-size: 11px; font-weight: 800; color: #a37233; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: block; }
    .ai-textarea { width: 100%; padding: 10px; border: 1px solid #e0ceb5; border-radius: 6px; font-size: 14px; background: #fff; outline: none; resize: vertical; }
    .btn-ai { width: 100%; background: #c59b27; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; transition: 0.2s; }
    .btn-ai:hover { background: #b0881e; }
    .btn-ai:disabled { background: #ccc; cursor: not-allowed; }
    
    /* Form thông tin */
    .form-group { margin-bottom: 16px; }
    .form-row { display: flex; gap: 12px; }
    .form-col { flex: 1; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 600; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #e2dcd5; border-radius: 6px; font-size: 14px; outline: none; background: #fff; }
    input:focus { border-color: #c59b27; }

    /* Thông báo Toast */
    .toast { display: none; background: #222; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 13px; text-align: center; margin-top: 10px; float: right; }
    .actions { display: flex; gap: 12px; margin-top: 24px; clear: both; }
    .btn-cancel { flex: 1; background: #fff; border: 1px solid #dcd3c9; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; color: #555; text-align: center; }
    .btn-submit { flex: 1; background: #a82e43; color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Thêm khách hẹn</h2>

  <!-- KHU VỰC NHẬP TỰ DO CHO AI -->
  <div class="ai-box">
    <span class="ai-title">✨ NÓI CẢ CÂU HOẶC GÕ TỰ DO ĐỂ AI TỰ ĐIỀN Ô:</span>
    <textarea id="ai-input" class="ai-textarea" rows="3" placeholder="Gõ bất kỳ câu gì, ví dụ: mai 2h chiều anh tuấn 0912345678 ghé sơn gel nhớ làm kỹ"></textarea>
    <button type="button" class="btn-ai" id="btn-ai-parse" onclick="handleSmartAnalysis()">✨ AI Phân Tích & Tự Điền Ô</button>
  </div>

  <!-- FORM TỰ ĐỘNG ĐIỀN DỮ LIỆU -->
  <form id="booking-form" onsubmit="event.preventDefault(); alert('Lưu lịch hẹn thành công!');">
    <div class="form-group">
      <label>Tên khách</label>
      <input type="text" id="input-name" placeholder="...">
    </div>

    <div class="form-group">
      <label>Số điện thoại</label>
      <input type="text" id="input-phone" placeholder="...">
    </div>

    <div class="form-row form-group">
      <div class="form-col">
        <label>Ngày</label>
        <input type="date" id="input-date">
      </div>
      <div class="form-col">
        <label>Giờ</label>
        <input type="time" id="input-time">
      </div>
    </div>

    <div class="form-group">
      <label>Dịch vụ</label>
      <input type="text" id="input-service" placeholder="...">
    </div>

    <div class="form-group">
      <label>Ghi chú</label>
      <input type="text" id="input-note" placeholder="...">
    </div>

    <div id="toast-msg" class="toast">✨ AI đã phân tích và điền xong!</div>

    <div class="actions">
      <button type="button" class="btn-cancel">Huỷ</button>
      <button type="submit" class="btn-submit">Lưu</button>
    </div>
  </form>
</div>

<script>
// Nhập API Key của bạn vào đây (Nếu không nhập, hệ thống sẽ dùng AI NLP Nội Bộ siêu thông minh)
const API_KEY = ""; 

/**
 * BỘ NÃO AI NLP NỘI BỘ (Chạy ngay lập tức, tự động trích xuất mọi kiểu gõ)
 */
function smartNLPParse(text) {
  const result = { name: '', phone: '', time: '', service: '', note: '' };
  let raw = text;

  // 1. Tự động nhận diện Số điện thoại (Chấp nhận chuỗi số bất kỳ từ 6 đến 11 số)
  const phoneMatch = raw.match(/(0\d{5,10})/);
  if (phoneMatch) {
    result.phone = phoneMatch[0];
    raw = raw.replace(result.phone, '');
  }

  // 2. Tự động nhận diện Thời gian (11h20, 11:20, 2h chiều, 14h, 9 rưỡi...)
  const timeMatch = raw.match(/(\d{1,2}(?:[:h]\d{2}|h)?(?:\s*(?:chiều|sáng|tối))?)/i);
  if (timeMatch) {
    let tStr = timeMatch[0].toLowerCase().trim();
    let isPm = tStr.includes('chiều') || tStr.includes('tối');
    tStr = tStr.replace(/(chiều|sáng|tối)/g, '').trim();

    let hour = 0, min = 0;
    if (tStr.includes(':')) {
      const parts = tStr.split(':');
      hour = parseInt(parts[0]);
      min = parseInt(parts[1]) || 0;
    } else if (tStr.includes('h')) {
      const parts = tStr.split('h');
      hour = parseInt(parts[0]);
      min = parseInt(parts[1]) || 0;
    } else {
      hour = parseInt(tStr);
    }

    if (isPm && hour < 12) hour += 12;
    result.time = `${String(hour).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
    raw = raw.replace(timeMatch[0], '');
  }

  // 3. Tự động trích xuất Tên khách hàng (Nhận diện xưng hô: anh, chị, cô, chú, em...)
  const nameMatch = raw.match(/(?:anh|chị|chi|cô|chu|chú|em|khách|khach)?\s*([a-zà-ỹA-ZÀ-Ỹ]+)/i);
  if (nameMatch) {
    // Bỏ qua các từ từ điển đặt lịch
    const ignoreWords = ['hen', 'hẹn', 'đặt', 'dat', 'lịch', 'lich', 'lúc', 'luc', 'ngày', 'ngay', 'mai', 'qua'];
    const candidate = nameMatch[1].trim();
    if (!ignoreWords.includes(candidate.toLowerCase())) {
      result.name = candidate;
      raw = raw.replace(nameMatch[0], '');
    }
  }

  // 4. Lọc các từ thừa để lấy Dịch vụ & Ghi chú
  let cleanRemaining = raw
    .replace(/(hen|hẹn|đặt|dat|lịch|lich|lúc|luc|ngày|ngay|mai|qua|cho|giúp|với)/gi, '')
    .replace(/\s+/g, ' ')
    .trim();

  // Phân tách Dịch vụ và Ghi chú (Nếu có các từ như "nhớ", "dặn", "ghi chú", "mang")
  if (cleanRemaining.includes('nhớ') || cleanRemaining.includes('ghi chú')) {
    const parts = cleanRemaining.split(/(?:nhớ|ghi chú)/i);
    result.service = parts[0].trim();
    result.note = parts[1].trim();
  } else {
    result.service = cleanRemaining;
  }

  return result;
}

/**
 * GỌI GEMINI AI ONLINE (Nếu có API Key)
 */
async function callGeminiAI(promptText) {
  if (!API_KEY) throw new Error("No Key");
  const models = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];
  
  for (const model of models) {
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `Đọc câu gõ tự do sau và tự động trích xuất JSON (no markdown):\n{"name":"Tên khách","phone":"SĐT","time":"Giờ dạng HH:mm","service":"Tên dịch vụ","note":"Ghi chú"}\nCâu nhập: "${promptText}"` }] }]
        })
      });
      if (!response.ok) continue;
      const data = await response.json();
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (text) return JSON.parse(text.replace(/```json/g, '').replace(/```/g, '').trim());
    } catch(e) {}
  }
  throw new Error("Failed");
}

/**
 * HÀM XỬ LÝ CHÍNH
 */
async function handleSmartAnalysis() {
  const inputEl = document.getElementById('ai-input');
  const btnEl = document.getElementById('btn-ai-parse');
  const toastEl = document.getElementById('toast-msg');
  const text = inputEl.value.trim();

  if (!text) {
    alert("Vui lòng gõ nội dung vào ô!");
    return;
  }

  btnEl.disabled = true;
  btnEl.innerText = "⏳ AI Đang Đọc & Điền Ô...";

  // 1. Phân tích nội bộ SIÊU TỐC ngay tức thì
  let data = smartNLPParse(text);
  applyToForm(data);

  // 2. Nếu có Key thì dùng Gemini AI làm mịn dữ liệu hơn
  if (API_KEY) {
    try {
      const aiData = await callGeminiAI(text);
      if (aiData) applyToForm(aiData);
    } catch(e) {}
  }

  // 3. Hoàn tất
  btnEl.disabled = false;
  btnEl.innerText = "✨ AI Phân Tích & Tự Điền Ô";
  toastEl.style.display = 'block';
  setTimeout(() => { toastEl.style.display = 'none'; }, 3000);
}

/**
 * GÁN GIÁ TRỊ VÀO CÁC Ô FORM & KÍCH HOẠT SỰ KIỆN GIAO DIỆN
 */
function applyToForm(data) {
  const setVal = (id, val) => {
    if (!val) return;
    const el = document.getElementById(id);
    if (el) {
      el.value = val;
      // Kích hoạt sự kiện để ô hiển thị chữ ngay, không bị đơ hoặc biến thành '...'
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.dispatchEvent(new Event('change', { bubbles: true }));
    }
  };

  setVal('input-name', data.name);
  setVal('input-phone', data.phone);
  setVal('input-time', data.time);
  setVal('input-service', data.service);
  setVal('input-note', data.note);

  // Mặc định chọn ngày hôm nay
  const dateEl = document.getElementById('input-date');
  if (dateEl && !dateEl.value) {
    dateEl.value = new Date().toISOString().split('T')[0];
    dateEl.dispatchEvent(new Event('change', { bubbles: true }));
  }
}
</script>

</body>
</html>
