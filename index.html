<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misa Nails - Quản Lý Lịch Hẹn Cloud</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f7f4f0; padding: 25px 15px; color: #333; }
    .container { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    
    .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #f0e2d3; }
    h2 { font-size: 20px; font-weight: 700; color: #2a2017; margin-bottom: 18px; }
    
    .ai-box { background-color: #f7ede1; border: 1px dashed #d8b88d; border-radius: 8px; padding: 14px; margin-bottom: 20px; }
    .ai-title { font-size: 11px; font-weight: 800; color: #a37233; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; display: block; }
    .ai-textarea { width: 100%; padding: 10px; border: 1px solid #e0ceb5; border-radius: 6px; font-size: 14px; background: #fff; outline: none; resize: none; color: #333; }
    .btn-ai { width: 100%; background: #c59b27; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .btn-ai:hover { background: #b0881e; }
    
    .form-group { margin-bottom: 16px; }
    .form-row { display: flex; gap: 12px; }
    .form-col { flex: 1; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 600; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #e8e2da; border-radius: 6px; font-size: 14px; outline: none; background: #fff; }
    input:focus { border-color: #c59b27; }

    .actions { display: flex; gap: 12px; margin-top: 20px; }
    .btn-cancel { flex: 1; background: #fff; border: 1px solid #dcd3c9; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; color: #555; text-align: center; }
    .btn-submit { flex: 1; background: #a82e43; color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; }

    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .badge-count { background: #f7ede1; color: #a37233; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 12px; }
    .status-cloud { font-size: 12px; color: #2e7d32; font-weight: 600; display: block; margin-top: 4px; }
    
    .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-bar input[type="text"] { flex: 2; min-width: 180px; }
    .filter-bar input[type="date"] { flex: 1; min-width: 140px; }
    .btn-reset-filter { background: #efe6db; border: none; padding: 10px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; color: #666; cursor: pointer; }

    .appointment-item { background: #faf8f5; border: 1px solid #eae2d8; border-radius: 8px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .appt-info h4 { font-size: 15px; color: #2a2017; margin-bottom: 4px; font-weight: 700; }
    .appt-info p { font-size: 13px; color: #666; margin-bottom: 2px; }
    .appt-time { background: #c59b27; color: #fff; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
    
    .item-actions { display: flex; gap: 6px; }
    .btn-edit { background: #fff; border: 1px solid #c59b27; color: #c59b27; font-size: 12px; cursor: pointer; font-weight: 600; padding: 6px 10px; border-radius: 4px; }
    .btn-delete { background: #fff; border: 1px solid #c53030; color: #c53030; font-size: 12px; cursor: pointer; font-weight: 600; padding: 6px 10px; border-radius: 4px; }
    .empty-msg { text-align: center; color: #999; font-size: 14px; padding: 20px 0; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2 id="form-title">Thêm khách hẹn</h2>

    <div class="ai-box">
      <span class="ai-title">✨ NÓI CẢ CÂU HOẶC GÕ TỰ DO ĐỂ AI TỰ ĐIỀN Ô:</span>
      <textarea id="ai-input" class="ai-textarea" rows="2" placeholder="minh dt 090909090 hen 12h28 lam chan nuoc"></textarea>
      <button type="button" class="btn-ai" id="btn-ai-action">✨ AI Phân Tích & Tự Điền Ô</button>
    </div>

    <form id="booking-form">
      <input type="hidden" id="editing-id" value="">

      <div class="form-group">
        <label>Tên khách</label>
        <input type="text" id="input-name" placeholder="...">
      </div>

      <div class="form-group">
        <label>Số điện thoại</label>
        <input type="text" id="input-phone" placeholder="...">
      </div>

      <div class="form-row form-group">
        <div class="form-col">
          <label>Ngày hẹn</label>
          <input type="date" id="input-date">
        </div>
        <div class="form-col">
          <label>Giờ hẹn</label>
          <input type="time" id="input-time">
        </div>
      </div>

      <div class="form-group">
        <label>Dịch vụ</label>
        <input type="text" id="input-service" placeholder="...">
      </div>

      <div class="form-group">
        <label>Ghi chú</label>
        <input type="text" id="input-note" placeholder="...">
      </div>

      <div class="actions">
        <button type="button" class="btn-cancel" id="btn-reset">Huỷ</button>
        <button type="submit" class="btn-submit" id="btn-submit-label">Lưu Đồng Bộ Cloud</button>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="list-header">
      <div>
        <h2>Lịch sử & Danh sách hẹn</h2>
        <span class="status-cloud" id="cloud-status">☁️ Đang kết nối Cloud...</span>
      </div>
      <span class="badge-count" id="appt-count">0 lịch hẹn</span>
    </div>

    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="🔍 Tìm Tên / SĐT...">
      <input type="date" id="filter-date">
      <button type="button" class="btn-reset-filter" id="btn-clear-filter">Xem Tất Cả</button>
    </div>
    
    <div id="appointment-list">
      <div class="empty-msg">Đang tải dữ liệu từ Cloud...</div>
    </div>
  </div>
</div>

<script>
// CẤU HÌNH CLOUD VỚI THÔNG TIN CỦA BẠN
const BIN_ID = "6a9b00deda38895dfe396730"; 
const API_KEY = "$2a$10$00.fYq60TlguOMR0w9QPCu0Odh85Dw.kN.Hyb5c4BXq8LXOwf3/ey";

let globalAppointments = [];

// TẢI DỮ LIỆU TỪ CLOUD
async function fetchFromCloud() {
  document.getElementById('cloud-status').innerText = "🔄 Đang đồng bộ...";
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { "X-Master-Key": API_KEY }
    });
    const data = await res.json();
    globalAppointments = Array.isArray(data.record.appointments) ? data.record.appointments : (Array.isArray(data.record) ? data.record : []);
    document.getElementById('cloud-status').innerText = "🟢 Đã đồng bộ tất cả thiết bị";
    renderList();
  } catch (err) {
    document.getElementById('cloud-status').innerText = "🔴 Lỗi đồng bộ Cloud!";
  }
}

// LƯU DỮ LIỆU LÊN CLOUD
async function saveToCloud(newList) {
  document.getElementById('cloud-status').innerText = "⏳ Đang lưu Cloud...";
  try {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      },
      body: JSON.stringify({ appointments: newList })
    });
    globalAppointments = newList;
    document.getElementById('cloud-status').innerText = "🟢 Đã lưu thành công";
    renderList();
  } catch (err) {
    alert("❌ Lỗi khi lưu lên Cloud!");
  }
}

// LƯU / SỬA FORM
document.getElementById('booking-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const editId = document.getElementById('editing-id').value;
  let list = [...globalAppointments];

  const itemData = {
    id: editId ? Number(editId) : Date.now(),
    name: document.getElementById('input-name').value.trim() || 'Khách không tên',
    phone: document.getElementById('input-phone').value.trim() || 'Chưa có SĐT',
    date: document.getElementById('input-date').value || new Date().toISOString().split('T')[0],
    time: document.getElementById('input-time').value || '--:--',
    service: document.getElementById('input-service').value.trim() || 'Dịch vụ chung',
    note: document.getElementById('input-note').value.trim() || ''
  };

  if (editId) {
    list = list.map(item => item.id === Number(editId) ? itemData : item);
  } else {
    list.unshift(itemData);
  }

  await saveToCloud(list);
  resetForm();
  alert('✅ Đã lưu thành công! Mọi thiết bị khác mở lên sẽ có lịch này ngay.');
});

window.editItem = function(id) {
  const item = globalAppointments.find(a => a.id === id);
  if (!item) return;

  document.getElementById('editing-id').value = item.id;
  document.getElementById('input-name').value = item.name;
  document.getElementById('input-phone').value = item.phone;
  document.getElementById('input-date').value = item.date;
  document.getElementById('input-time').value = item.time;
  document.getElementById('input-service').value = item.service;
  document.getElementById('input-note').value = item.note || '';

  document.getElementById('form-title').innerText = "Chỉnh sửa lịch hẹn";
  document.getElementById('btn-submit-label').innerText = "Cập nhật Lên Cloud";
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.deleteItem = async function(id) {
  if (confirm('Xoá lịch hẹn này trên mọi thiết bị?')) {
    let list = globalAppointments.filter(item => item.id !== id);
    await saveToCloud(list);
  }
};

function renderList() {
  const keyword = document.getElementById('search-input').value.toLowerCase().trim();
  const dateVal = document.getElementById('filter-date').value;

  const filtered = globalAppointments.filter(item => {
    const matchKw = item.name.toLowerCase().includes(keyword) || item.phone.includes(keyword);
    const matchDate = dateVal ? item.date === dateVal : true;
    return matchKw && matchDate;
  });

  document.getElementById('appt-count').innerText = `${filtered.length} lịch hẹn`;
  const container = document.getElementById('appointment-list');

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-msg">${dateVal ? 'Không có lịch hẹn ngày ' + dateVal : 'Chưa có lịch hẹn nào.'}</div>`;
    return;
  }

  container.innerHTML = filtered.map(item => `
    <div class="appointment-item">
      <div class="appt-info">
        <span class="appt-time">⏰ ${item.time} - Ngày: ${item.date}</span>
        <h4>👤 ${item.name} - 📞 ${item.phone}</h4>
        <p>💅 <strong>Dịch vụ:</strong> ${item.service}</p>
        ${item.note ? `<p>📝 <strong>Ghi chú:</strong> ${item.note}</p>` : ''}
      </div>
      <div class="item-actions">
        <button class="btn-edit" onclick="editItem(${item.id})">Sửa</button>
        <button class="btn-delete" onclick="deleteItem(${item.id})">Xoá</button>
      </div>
    </div>
  `).join('');
}

// AI PHÂN TÍCH TỰ ĐIỀN
document.getElementById('btn-ai-action').addEventListener('click', function() {
  const text = document.getElementById('ai-input').value.trim();
  if (!text) return;

  let raw = text;
  let phone = '', time = '', name = '', service = '';

  const phoneMatch = raw.match(/(0\d{5,10})/);
  if (phoneMatch) { phone = phoneMatch[0]; raw = raw.replace(phone, ''); }

  const timeMatch = raw.match(/(\d{1,2}(?:[:h]\d{2}|h)?)/i);
  if (timeMatch) {
    let t = timeMatch[0].toLowerCase().replace('h', ':');
    if (!t.includes(':')) t += ':00';
    const parts = t.split(':');
    time = `${parts[0].padStart(2, '0')}:${(parts[1] || '00').padStart(2, '0')}`;
    raw = raw.replace(timeMatch[0], '');
  }

  let clean = raw.replace(/(hen|hẹn|đặt|dat|lịch|lich|lúc|luc|dt|đt|làm|lam)/gi, '').replace(/\s+/g, ' ').trim();
  const words = clean.split(' ');
  if (words.length > 0) {
    name = words[0];
    service = words.slice(1).join(' ');
  }

  document.getElementById('input-name').value = name;
  document.getElementById('input-phone').value = phone;
  document.getElementById('input-time').value = time;
  document.getElementById('input-service').value = service;
  
  if (!document.getElementById('input-date').value) {
    document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
  }
});

function resetForm() {
  document.getElementById('booking-form').reset();
  document.getElementById('editing-id').value = '';
  document.getElementById('ai-input').value = '';
  document.getElementById('form-title').innerText = "Thêm khách hẹn";
  document.getElementById('btn-submit-label').innerText = "Lưu Đồng Bộ Cloud";
}

document.getElementById('btn-reset').addEventListener('click', resetForm);
document.getElementById('search-input').addEventListener('input', renderList);
document.getElementById('filter-date').addEventListener('change', renderList);
document.getElementById('btn-clear-filter').addEventListener('click', function() {
  document.getElementById('search-input').value = '';
  document.getElementById('filter-date').value = '';
  renderList();
});

// TẢI LỊCH MỚI KHI MỞ TRANG
window.addEventListener('DOMContentLoaded', fetchFromCloud);
</script>

</body>
</html>
