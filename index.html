<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AGENDA DE UÑAS</title>
  <style>
    :root {
      --primary-color: #A8324A;
      --bg-color: #FAF6F0;
      --card-bg: #FFFFFF;
      --text-dark: #2A2421;
      --text-muted: #8C827A;
      --border-color: #EFE8E1;
      --input-bg: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; }

    /* HEADER TOP */
    header { background: var(--bg-color); padding: 14px 20px 8px; display: flex; justify-content: space-between; align-items: center; }
    .logo-title { font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.8px; text-transform: uppercase; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    
    /* BOTÓN VER CALENDARIO PARA DI DỘNG */
    .btn-action-top-wrapper {
      position: relative;
      display: inline-block;
    }

    .btn-action-top { 
      background: #EFE4DC; 
      border: 1px solid #D5C7BC; 
      border-radius: 14px; 
      padding: 6px 12px; 
      font-size: 11px; 
      font-weight: 700; 
      color: var(--primary-color); 
      display: flex; 
      align-items: center; 
      gap: 4px; 
      pointer-events: none;
    }

    .btn-action-top-wrapper input[type="date"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      -webkit-appearance: none;
    }

    /* DATE BANNER */
    .date-banner { padding: 4px 20px 16px; background: var(--bg-color); display: flex; align-items: baseline; gap: 8px; }
    .big-day { font-size: 32px; font-weight: 800; color: var(--text-dark); line-height: 1; }
    .date-details { font-size: 12px; color: var(--primary-color); font-weight: 600; line-height: 1.2; }
    .sub-date { font-size: 11px; color: var(--text-muted); font-weight: 400; }

    /* TAB NAV */
    .tab-nav { display: flex; background: var(--bg-color); border-bottom: 1px solid var(--border-color); }
    .tab-item { flex: 1; text-align: center; padding: 12px 0; font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-item.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }

    /* DAY CONTROLLER */
    .day-nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--bg-color); }
    .nav-btn { width: 28px; height: 28px; border-radius: 50%; border: none; background: #EFE4DC; color: #665E57; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .current-view-title { font-size: 13px; font-weight: 700; color: var(--text-dark); }
    .btn-today { background: transparent; border: 1px solid #E2D7CD; border-radius: 12px; padding: 4px 12px; font-size: 11px; font-weight: 600; color: var(--text-muted); cursor: pointer; }

    /* CALENDAR CONTENT AREA */
    .calendar-content { flex: 1; padding: 15px 20px 100px; display: flex; flex-direction: column; }
    .empty-state { text-align: center; padding: 40px 10px; margin: auto 0; }
    .empty-state h3 { font-size: 14px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
    .empty-state p { font-size: 12px; color: var(--text-muted); }

    /* CARD DE CLIENTE */
    .appt-card { background: #FFF; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.01); }
    .appt-time { background: var(--primary-color); color: #FFF; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 700; display: inline-block; margin-bottom: 4px; }
    .appt-name { font-size: 15px; font-weight: 700; color: var(--text-dark); }
    .appt-phone { font-size: 13px; color: var(--text-muted); font-weight: 400; }
    .appt-service { font-size: 12px; color: #554E48; margin-top: 3px; }
    .appt-actions button { background: none; border: none; padding: 4px 6px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .btn-edit-act { color: #C59B27; }
    .btn-del-act { color: #A8324A; }

    /* BOTÓN FLOTANTE (+ NUEVA CITA) */
    .btn-float-add { position: fixed; bottom: 20px; right: 20px; background: var(--primary-color); color: #FFF; border: none; border-radius: 20px; padding: 10px 18px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(168, 50, 74, 0.35); display: flex; align-items: center; gap: 5px; z-index: 90; }

    /* MODAL FORMULARIO */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; justify-content: flex-end; flex-direction: column; z-index: 100; backdrop-filter: blur(2px); }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--bg-color); border-radius: 20px 20px 0 0; padding: 12px 20px 24px; width: 100%; max-width: 600px; margin: 0 auto; max-height: 90vh; overflow-y: auto; box-shadow: 0 -8px 30px rgba(0,0,0,0.12); animation: slideUp 0.22s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .drag-handle { width: 36px; height: 4px; background: #E2D8CE; border-radius: 2px; margin: 0 auto 12px; }
    .modal-title { font-size: 16px; font-weight: 800; color: var(--text-dark); margin-bottom: 12px; }

    /* HERRAMIENTA IA */
    .ai-box { background: #F3ECE5; border: 1px dashed #D5C7BC; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
    .ai-header { font-size: 11px; font-weight: 700; color: var(--primary-color); display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
    .ai-input-wrapper { display: flex; gap: 8px; }
    .ai-input-wrapper input { flex: 1; padding: 8px 10px; border: 1px solid #E0D4C8; border-radius: 6px; font-size: 12px; background: #FFF; outline: none; }
    .btn-ai-parse { background: var(--primary-color); color: #FFF; border: none; padding: 0 12px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
    .form-group input, .form-group textarea { width: 100%; padding: 11px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; background: var(--input-bg); outline: none; color: var(--text-dark); }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--primary-color); }
    .form-row { display: flex; gap: 10px; }
    .form-col { flex: 1; }

    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn-modal-cancel { flex: 1; background: #FFF; border: 1px solid #E5DCD3; padding: 12px; border-radius: 8px; font-weight: 700; color: #665E57; cursor: pointer; text-align: center; font-size: 13px; }
    .btn-modal-save { flex: 1; background: var(--primary-color); border: none; padding: 12px; border-radius: 8px; font-weight: 700; color: #FFF; cursor: pointer; text-align: center; font-size: 13px; }
  </style>

  <!-- Firebase JS SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBwzbPL60nM2WaLnFXwuZdBo_uP65X5Ck",
      authDomain: "misa-nails.firebaseapp.com",
      projectId: "misa-nails",
      storageBucket: "misa-nails.firebasestorage.app",
      messagingSenderId: "1026976403731",
      appId: "1:1026976403731:web:c12f28c237c13990134ae6",
      measurementId: "G-XNHBT4Y17G"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const appointmentsCol = collection(db, "appointments");

    window.globalAppointments = [];

    const q = query(appointmentsCol, orderBy("date", "asc"));
    onSnapshot(q, (snapshot) => {
      window.globalAppointments = snapshot.docs.map(doc => ({
        docId: doc.id,
        ...doc.data()
      }));
      renderAppointments();
    }, (error) => {
      console.error("Firebase Error:", error);
    });

    document.getElementById('modal-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const docId = document.getElementById('editing-id').value;

      const itemData = {
        name: document.getElementById('input-name').value.trim() || 'Cliente sin nombre',
        phone: document.getElementById('input-phone').value.trim() || '',
        date: document.getElementById('input-date').value || window.currentSelectedDate,
        time: document.getElementById('input-time').value || '09:00',
        service: document.getElementById('input-service').value.trim() || 'Servicio de Uñas',
        note: document.getElementById('input-note').value.trim() || ''
      };

      try {
        if (docId) {
          await updateDoc(doc(db, "appointments", docId), itemData);
        } else {
          await addDoc(appointmentsCol, itemData);
        }
        closeModal();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });

    window.deleteItem = async function(docId) {
      if (confirm('¿Estás seguro de que deseas eliminar esta cita?')) {
        try {
          await deleteDoc(doc(db, "appointments", docId));
        } catch (err) {
          alert('¡No se pudo eliminar!');
        }
      }
    };
  </script>
</head>
<body>

  <!-- HEADER TOP -->
  <header>
    <div class="logo-title">AGENDA DE UÑAS</div>
    <div class="header-actions">
      <!-- BOTÓN VER CALENDARIO -->
      <div class="btn-action-top-wrapper">
        <button class="btn-action-top">
          📅 <span>Ver Calendario</span>
        </button>
        <input type="date" id="top-date-picker" lang="es" onchange="onDateSelectedFromPicker(this.value)">
      </div>
    </div>
  </header>

  <!-- DATE BANNER -->
  <div class="date-banner">
    <div class="big-day" id="banner-day-num">--</div>
    <div>
      <div class="date-details" id="banner-day-name">--</div>
      <div class="sub-date" id="banner-month-year">--, ----</div>
    </div>
  </div>

  <!-- TAB NAV -->
  <div class="tab-nav">
    <div class="tab-item active" id="tab-hoy" onclick="selectQuickTab('hoy')">Hoy</div>
    <div class="tab-item" id="tab-manana" onclick="selectQuickTab('manana')">Mañana</div>
  </div>

  <!-- DAY NAV CONTROLLER -->
  <div class="day-nav">
    <button class="nav-btn" onclick="changeDate(-1)">❮</button>
    <div class="current-view-title" id="view-title">--/--</div>
    <button class="btn-today" onclick="goToday()">Hoy</button>
    <button class="nav-btn" onclick="changeDate(1)">❯</button>
  </div>

  <!-- CALENDAR CONTENT -->
  <div class="calendar-content" id="calendar-content">
    <div class="empty-state">
      <h3>Sin citas programadas</h3>
      <p>Toca "+ Nueva Cita" para agregar clientes en este día</p>
    </div>
  </div>

  <!-- FLOATING BUTTON (+ NUEVA CITA) -->
  <button class="btn-float-add" onclick="openModal()">
    <span>+</span> <span>Nueva Cita</span>
  </button>

  <!-- MODAL / BOTTOM SHEET FORM -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <div class="drag-handle"></div>
      <div class="modal-title" id="modal-form-title">Agregar Nueva Cita</div>

      <!-- HERRAMIENTA IA -->
      <div class="ai-box">
        <div class="ai-header">✨ ASISTENTE RÁPIDO IA</div>
        <div class="ai-input-wrapper">
          <input type="text" id="ai-smart-input" placeholder="Ej: Mañana María cita 5:30 num 631 95 95 completo" onkeyup="if(event.key==='Enter') runAIParsing()">
          <button type="button" class="btn-ai-parse" onclick="runAIParsing()">Analizar IA</button>
        </div>
      </div>

      <form id="modal-form">
        <input type="hidden" id="editing-id" value="">

        <div class="form-group">
          <label>Nombre del Cliente</label>
          <input type="text" id="input-name" placeholder="Maria">
        </div>

        <div class="form-group">
          <label>Número de Teléfono</label>
          <input type="text" id="input-phone" placeholder="612 123 456">
        </div>

        <div class="form-row form-group">
          <div class="form-col">
            <label>Fecha</label>
            <input type="date" id="input-date" lang="es">
          </div>
          <div class="form-col">
            <label>Hora</label>
            <input type="time" id="input-time">
          </div>
        </div>

        <div class="form-group">
          <label>Servicio de Uñas</label>
          <input type="text" id="input-service" placeholder="Relleno Acrílico + French">
        </div>

        <div class="form-group">
          <label>Notas / Observaciones</label>
          <textarea id="input-note" rows="2" placeholder="..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-modal-cancel" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn-modal-save">Guardar Cita</button>
        </div>
      </form>
    </div>
  </div>

<script>
  let selectedDate = new Date();
  window.currentSelectedDate = formatDateStr(selectedDate);

  const daysNameES = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const shortDaysES = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  const monthsNameES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

  function formatDateStr(d) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function onDateSelectedFromPicker(val) {
    if (!val) return;
    const parts = val.split('-');
    selectedDate = new Date(parts[0], parts[1] - 1, parts[2]);
    updateHeaderBanner();
  }

  function selectQuickTab(tab) {
    const today = new Date();
    if (tab === 'hoy') {
      selectedDate = today;
    } else if (tab === 'manana') {
      const tomorrow = new Date();
      tomorrow.setDate(today.getDate() + 1);
      selectedDate = tomorrow;
    }
    updateHeaderBanner();
  }

  function syncTabHighlight() {
    const todayStr = formatDateStr(new Date());
    const tomorrowStr = formatDateStr(new Date(Date.now() + 86400000));
    
    document.getElementById('tab-hoy').classList.remove('active');
    document.getElementById('tab-manana').classList.remove('active');

    if (window.currentSelectedDate === todayStr) {
      document.getElementById('tab-hoy').classList.add('active');
    } else if (window.currentSelectedDate === tomorrowStr) {
      document.getElementById('tab-manana').classList.add('active');
    }
  }

  function updateHeaderBanner() {
    document.getElementById('banner-day-num').innerText = selectedDate.getDate();
    document.getElementById('banner-day-name').innerText = daysNameES[selectedDate.getDay()];
    document.getElementById('banner-month-year').innerText = `${monthsNameES[selectedDate.getMonth()]}, ${selectedDate.getFullYear()}`;
    
    const dayShort = shortDaysES[selectedDate.getDay()];
    document.getElementById('view-title').innerText = `${dayShort}, ${selectedDate.getDate()}/${selectedDate.getMonth() + 1}`;
    
    window.currentSelectedDate = formatDateStr(selectedDate);
    document.getElementById('top-date-picker').value = window.currentSelectedDate;
    
    syncTabHighlight();
    renderAppointments();
  }

  function changeDate(days) {
    selectedDate.setDate(selectedDate.getDate() + days);
    updateHeaderBanner();
  }

  function goToday() {
    selectedDate = new Date();
    updateHeaderBanner();
  }

  function renderAppointments() {
    const container = document.getElementById('calendar-content');
    const targetDate = window.currentSelectedDate;

    const list = (window.globalAppointments || []).filter(item => item.date === targetDate);

    if (list.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <h3>Sin citas programadas</h3>
          <p>Toca "+ Nueva Cita" para agregar clientes en este día</p>
        </div>`;
      return;
    }

    list.sort((a, b) => (a.time || '').localeCompare(b.time || ''));

    container.innerHTML = list.map(item => `
      <div class="appt-card">
        <div>
          <span class="appt-time">⏰ ${item.time}</span>
          <div class="appt-name">${item.name} ${item.phone ? `<span class="appt-phone">(${item.phone})</span>` : ''}</div>
          <div class="appt-service">💅 ${item.service} ${item.note ? `| 📝 ${item.note}` : ''}</div>
        </div>
        <div class="appt-actions">
          <button class="btn-edit-act" onclick="editItem('${item.docId}')">Editar</button>
          <button class="btn-del-act" onclick="deleteItem('${item.docId}')">Eliminar</button>
        </div>
      </div>
    `).join('');
  }

  function openModal() {
    document.getElementById('modal-form').reset();
    document.getElementById('ai-smart-input').value = '';
    document.getElementById('editing-id').value = '';
    document.getElementById('input-date').value = window.currentSelectedDate;
    document.getElementById('input-time').value = "09:00";
    document.getElementById('modal-form-title').innerText = "Agregar Nueva Cita";
    document.getElementById('modal-overlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('active');
  }

  window.editItem = function(docId) {
    const item = window.globalAppointments.find(a => a.docId === docId);
    if (!item) return;

    document.getElementById('editing-id').value = item.docId;
    document.getElementById('input-name').value = item.name;
    document.getElementById('input-phone').value = item.phone || '';
    document.getElementById('input-date').value = item.date;
    document.getElementById('input-time').value = item.time;
    document.getElementById('input-service').value = item.service;
    document.getElementById('input-note').value = item.note || '';

    document.getElementById('modal-form-title').innerText = "Editar Cita";
    document.getElementById('modal-overlay').classList.add('active');
  };

  /* BỘ PHÂN TÍCH IA THÔNG MINH CHO TIẾNG TÂY BAN NHA */
  function runAIParsing() {
    let str = document.getElementById('ai-smart-input').value.trim();
    if (!str) return;

    let workingStr = str;
    let now = new Date();
    let targetYear = now.getFullYear();
    let targetMonth = now.getMonth();
    let targetDay = now.getDate();

    // 1. TÁCH SỐ ĐIỆN THOẠI (Ví dụ: 631 95 95, 612123456)
    let phoneMatch = workingStr.match(/(?:num|núm|número|numero|tel|teléfono|telefono)?\s*([679]\d{2}[\s.-]?\d{2,3}[\s.-]?\d{2,3})/i);
    if (phoneMatch) {
      let rawPhone = phoneMatch[1].replace(/[\s.-]/g, '');
      document.getElementById('input-phone').value = rawPhone;
      workingStr = workingStr.replace(phoneMatch[0], ' ');
    }

    // 2. TÁCH GIỜ (Tự động chuyển 5:30 thành 17:30 nếu không ghi AM)
    let isPM = /tarde|noche|pm/i.test(workingStr);
    let timeMatch = workingStr.match(/(?:a las\s*)?(\d{1,2})[\.:h](\d{2})|(\d{1,2})\s*(?:h|pm|am|hs|hrs)/i);
    
    if (timeMatch) {
      let h = parseInt(timeMatch[1] || timeMatch[3], 10);
      let m = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0;
      
      // Nếu giờ từ 1 đến 6 và không ghi AM -> tự hiểu là PM (Giờ chiều)
      if ((isPM || (h >= 1 && h <= 6)) && h < 12) {
        h += 12;
      }
      
      if (h >= 0 && h <= 23 && m >= 0 && m <= 59) {
        document.getElementById('input-time').value = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      }
      workingStr = workingStr.replace(timeMatch[0], ' ');
    }

    // 3. TÁCH NGÀY (Mañana, Hoy, día X)
    if (/mañana/i.test(workingStr)) {
      targetDay = now.getDate() + 1;
      workingStr = workingStr.replace(/mañana/gi, ' ');
    } else if (/hoy/i.test(workingStr)) {
      targetDay = now.getDate();
      workingStr = workingStr.replace(/hoy/gi, ' ');
    } else {
      let dayMatch = workingStr.match(/(?:día|dia)\s*(\d{1,2})/i);
      if (dayMatch) {
        targetDay = parseInt(dayMatch[1], 10);
        if (targetDay < now.getDate()) targetMonth += 1;
        workingStr = workingStr.replace(dayMatch[0], ' ');
      }
    }
    let resultDateObj = new Date(targetYear, targetMonth, targetDay);
    document.getElementById('input-date').value = formatDateStr(resultDateObj);

    // 4. TÁCH DỊCH VỤ (Completo, Relleno, Acrílico, Uñas, Gel, Pedicura, Manicura)
    let servicesMap = [
      { key: /completo/i, val: "Set Completo" },
      { key: /relleno/i, val: "Relleno Acrílico" },
      { key: /acrilico|acrílico/i, val: "Uñas de Acrílico" },
      { key: /french|francesa/i, val: "Uñas Francesas" },
      { key: /pedicura|pedicure/i, val: "Pedicura" },
      { key: /manicura|manicure/i, val: "Manicura" },
      { key: /gel/i, val: "Esmaltado Permanente Gel" }
    ];

    let foundService = "";
    for (let s of servicesMap) {
      if (s.key.test(workingStr)) {
        foundService = s.val;
        workingStr = workingStr.replace(s.key, ' ');
        break;
      }
    }
    document.getElementById('input-service').value = foundService || 'Servicio de Uñas';

    // 5. TÁCH TÊN KHÁCH HÀNG (Loại bỏ câu từ thừa)
    let cleanName = workingStr
      .replace(/tiene|cita|en|núm|num|número|numero|lo|hace|con|el|la|de|para|a|las/gi, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    if (cleanName) {
      cleanName = cleanName.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
      document.getElementById('input-name').value = cleanName;
    } else {
      document.getElementById('input-name').value = 'Cliente';
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    updateHeaderBanner();
  });
</script>

</body>
</html>
