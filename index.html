<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thêm Khách Hẹn - Tự Động Điền AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f7f4f0; padding: 20px; color: #333; }
    .card { max-width: 650px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { font-size: 20px; font-weight: 700; color: #222; margin-bottom: 16px; }
    
    /* Vùng nhập AI */
    .ai-box { background-color: #f5e9d6; border: 1px dashed #c8a36e; border-radius: 8px; padding: 14px; margin-bottom: 20px; }
    .ai-title { font-size: 11px; font-weight: 800; color: #a37233; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: block; }
    .ai-textarea { width: 100%; padding: 10px; border: 1px solid #e0ceb5; border-radius: 6px; font-size: 14px; background: #fff; outline: none; resize: vertical; }
    .btn-ai { width: 100%; background: #c59b27; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; transition: 0.2s; }
    .btn-ai:hover { background: #b0881e; }
    
    /* Form nhập liệu */
    .form-group { margin-bottom: 16px; }
    .form-row { display: flex; gap: 12px; }
    .form-col { flex: 1; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 600; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #e2dcd5; border-radius: 6px; font-size: 14px; outline: none; background: #fff; }
    input:focus { border-color: #c59b27; }

    /* Thông báo Toast */
    .toast { display: none; background: #222; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 13px; text-align: center; margin-top: 10px; float: right; }
    .actions { display: flex; gap: 12px; margin-top: 24px; clear: both; }
    .btn-cancel { flex: 1; background: #fff; border: 1px solid #dcd3c9; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; color: #555; text-align: center; }
    .btn-submit { flex: 1; background: #a82e43; color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Thêm khách hẹn</h2>

  <!-- KHU VỰC AI TỰ ĐIỀN Ô -->
  <div class="ai-box">
    <span class="ai-title">✨ NÓI CẢ CÂU HOẶC GÕ ĐỂ AI TỰ ĐIỀN Ô:</span>
    <textarea id="ai-input" class="ai-textarea" rows="2" placeholder="bin 0909090 hen 11h20 chan nước"></textarea>
    <button type="button" class="btn-ai" id="btn-ai-parse" onclick="handleFastAnalysis()">✨ AI Phân Tích & Tự Điền Ô</button>
  </div>

  <!-- FORM THÔNG TIN -->
  <form id="booking-form" onsubmit="event.preventDefault(); alert('Đã lưu thành công!');">
    <div class="form-group">
      <label>Tên khách</label>
      <input type="text" id="input-name" placeholder="...">
    </div>

    <div class="form-group">
      <label>Số điện thoại</label>
      <input type="text" id="input-phone" placeholder="...">
    </div>

    <div class="form-row form-group">
      <div class="form-col">
        <label>Ngày</label>
        <input type="date" id="input-date">
      </div>
      <div class="form-col">
        <label>Giờ</label>
        <input type="time" id="input-time">
      </div>
    </div>

    <div class="form-group">
      <label>Dịch vụ</label>
      <input type="text" id="input-service" placeholder="...">
    </div>

    <div class="form-group">
      <label>Ghi chú</label>
      <input type="text" id="input-note" placeholder="...">
    </div>

    <div id="toast-msg" class="toast">✨ AI đã phân tích và điền xong!</div>

    <div class="actions">
      <button type="button" class="btn-cancel">Huỷ</button>
      <button type="submit" class="btn-submit">Lưu</button>
    </div>
  </form>
</div>

<script>
const API_KEY = ""; // Điền API Key của bạn nếu muốn gọi Gemini trực tuyến

// 1. Phân tích Regex siêu tốc (< 5ms)
function superFastRegexParse(inputText) {
  const result = { name: '', phone: '', time: '', service: '', note: '' };

  // Tách Số điện thoại (chấp nhận từ 6 - 11 chữ số)
  const phoneMatch = inputText.match(/(0\d{5,10})/);
  if (phoneMatch) result.phone = phoneMatch[0];

  // Tách Giờ (11h20, 11:20, 11h)
  const timeMatch = inputText.match(/(\d{1,2}(?:[:h]\d{2}|h))/i);
  if (timeMatch) {
    let t = timeMatch[0].toLowerCase().replace('h', ':');
    if (!t.includes(':')) t += ':00';
    const parts = t.split(':');
    result.time = `${parts[0].padStart(2, '0')}:${(parts[1] || '00').padStart(2, '0')}`;
  }

  // Tách Tên khách và Dịch vụ từ các từ còn lại
  let cleanText = inputText
    .replace(result.phone || '', '')
    .replace(timeMatch ? timeMatch[0] : '', '')
    .replace(/hen|hẹn/gi, '')
    .replace(/\s+/g, ' ')
    .trim();

  const words = cleanText.split(' ');
  if (words.length > 0 && words[0]) {
    result.name = words[0];
    result.service = words.slice(1).join(' ');
  }

  return result;
}

// 2. Hàm gọi Gemini API dự phòng
async function fetchGeminiAPI(inputText) {
  if (!API_KEY) throw new Error("No Key");
  const models = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];
  
  for (const model of models) {
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `Trả về duy nhất JSON (no markdown) từ câu: "${inputText}". JSON format: {"name":"","phone":"","time":"HH:mm","service":"","note":""}` }] }]
        })
      });
      if (!response.ok) continue;
      const data = await response.json();
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (text) return JSON.parse(text.replace(/```json/g, '').replace(/```/g, '').trim());
    } catch(e) {}
  }
  throw new Error("API Failed");
}

// 3. Hàm xử lý chính khi bấm nút
async function handleFastAnalysis() {
  const inputEl = document.getElementById('ai-input');
  const btnEl = document.getElementById('btn-ai-parse');
  const toastEl = document.getElementById('toast-msg');
  const inputText = inputEl.value.trim();

  if (!inputText) return;

  btnEl.disabled = true;

  // Bước 1: Điền ngay lập tức kết quả từ Regex (< 5ms)
  let data = superFastRegexParse(inputText);
  fillToForm(data);

  // Bước 2: Song song gọi API bổ trợ nếu có Key
  if (API_KEY) {
    try {
      const aiData = await fetchGeminiAPI(inputText);
      if (aiData) fillToForm(aiData);
    } catch (e) {}
  }

  // Bước 3: Hiện thông báo thành công
  btnEl.disabled = false;
  toastEl.style.display = 'block';
  setTimeout(() => { toastEl.style.display = 'none'; }, 3000);
}

// 4. Hàm điền giá trị và kích hoạt sự kiện thay đổi dữ liệu
function fillToForm(data) {
  const setVal = (id, val) => {
    if (!val) return;
    const el = document.getElementById(id);
    if (el) {
      el.value = val;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.dispatchEvent(new Event('change', { bubbles: true }));
    }
  };

  setVal('input-name', data.name);
  setVal('input-phone', data.phone);
  setVal('input-time', data.time);
  setVal('input-service', data.service);
  setVal('input-note', data.note);

  // Tự điền ngày hôm nay nếu chưa chọn
  const dateEl = document.getElementById('input-date');
  if (dateEl && !dateEl.value) {
    const today = new Date().toISOString().split('T')[0];
    dateEl.value = today;
    dateEl.dispatchEvent(new Event('change', { bubbles: true }));
  }
}
</script>

</body>
</html>
