<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SỔ LỊCH NAIL</title>
  <style>
    :root {
      --primary-color: #a82e43;
      --bg-color: #f8f4f1;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e8e0d8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; position: relative; padding-bottom: 80px; }

    /* HEADER */
    header { background: #fff; padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .logo-title { font-size: 13px; font-weight: 700; color: #666; letter-spacing: 0.5px; }
    .search-icon { font-size: 18px; cursor: pointer; color: #666; }

    /* DATE BANNER */
    .date-banner { padding: 15px 20px; background: #fff; display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--border-color); }
    .big-day { font-size: 36px; font-weight: 800; color: #111; line-height: 1; }
    .date-details { font-size: 13px; color: var(--primary-color); font-weight: 600; }
    .sub-date { font-size: 12px; color: #888; display: block; margin-top: 2px; }

    /* TAB NAV */
    .tab-nav { display: flex; background: #fff; border-bottom: 1px solid var(--border-color); }
    .tab-item { flex: 1; text-align: center; padding: 12px 0; font-size: 14px; font-weight: 600; color: #666; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab-item.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }

    /* NAV BAR DAY CONTROL */
    .day-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--bg-color); }
    .nav-btn { width: 28px; height: 28px; border-radius: 50%; border: none; background: #ebdcd3; color: #555; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .current-view-title { font-size: 14px; font-weight: 700; color: #444; }
    .btn-today { background: #f0e6dd; border: 1px solid #d4c3b5; border-radius: 15px; padding: 4px 12px; font-size: 12px; font-weight: 600; color: #666; cursor: pointer; }

    /* APPOINTMENT CONTAINER */
    .calendar-content { padding: 20px; max-width: 800px; margin: 0 auto; min-height: 250px; }
    .empty-state { text-align: center; padding: 40px 20px; color: #777; }
    .empty-state h3 { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 6px; }
    .empty-state p { font-size: 13px; color: #888; }

    .appt-card { background: #fff; border-radius: 10px; padding: 15px; margin-bottom: 12px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .appt-time { background: var(--primary-color); color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; display: inline-block; margin-bottom: 5px; }
    .appt-name { font-size: 16px; font-weight: 700; color: #222; }
    .appt-phone { font-size: 13px; color: #666; }
    .appt-service { font-size: 13px; color: #444; margin-top: 4px; }
    .appt-actions button { background: none; border: none; padding: 5px 8px; font-size: 13px; cursor: pointer; font-weight: 600; }
    .btn-edit-act { color: #c59b27; }
    .btn-del-act { color: #c53030; }

    /* FLOATING ADD BUTTON */
    .btn-float-add { position: fixed; bottom: 25px; right: 25px; background: var(--primary-color); color: #fff; border: none; border-radius: 25px; padding: 12px 22px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(168, 46, 67, 0.3); display: flex; align-items: center; gap: 6px; z-index: 99; }

    /* MODAL SLIDE UP FORM */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; justify-content: flex-end; flex-direction: column; z-index: 100; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--bg-color); border-radius: 20px 20px 0 0; padding: 20px 24px 30px; width: 100%; max-width: 900px; margin: 0 auto; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 -5px 25px rgba(0,0,0,0.15); animation: slideUp 0.25s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .drag-handle { width: 36px; height: 4px; background: #ccc; border-radius: 2px; margin: 0 auto 15px; }
    .modal-title { font-size: 18px; font-weight: 700; color: #222; margin-bottom: 15px; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: #555; margin-bottom: 5px; font-weight: 600; }
    .form-group input, .form-group textarea { width: 100%; padding: 12px 14px; border: 1px solid #e2d7cc; border-radius: 8px; font-size: 14px; background: #fff; outline: none; }
    .form-row { display: flex; gap: 12px; }
    .form-col { flex: 1; }
    .hint-text { font-size: 11px; color: #999; margin-top: 4px; }

    .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
    .btn-modal-cancel { flex: 1; background: #fff; border: 1px solid #d4c3b5; padding: 14px; border-radius: 8px; font-weight: 700; color: #555; cursor: pointer; text-align: center; }
    .btn-modal-save { flex: 1; background: var(--primary-color); border: none; padding: 14px; border-radius: 8px; font-weight: 700; color: #fff; cursor: pointer; text-align: center; font-size: 14px; }
  </style>

  <!-- Firebase JS SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBwzbPL60nM2WaLnFXwuZdBo_uP65X5Ck",
      authDomain: "misa-nails.firebaseapp.com",
      projectId: "misa-nails",
      storageBucket: "misa-nails.firebasestorage.app",
      messagingSenderId: "1026976403731",
      appId: "1:1026976403731:web:c12f28c237c13990134ae6",
      measurementId: "G-XNHBT4Y17G"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const appointmentsCol = collection(db, "appointments");

    window.globalAppointments = [];

    // Lắng nghe dữ liệu Firebase Realtime
    const q = query(appointmentsCol, orderBy("date", "asc"));
    onSnapshot(q, (snapshot) => {
      window.globalAppointments = snapshot.docs.map(doc => ({
        docId: doc.id,
        ...doc.data()
      }));
      renderAppointments();
    }, (error) => {
      console.error(error);
    });

    // Thêm hoặc Cập nhật Lịch
    document.getElementById('modal-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const docId = document.getElementById('editing-id').value;
      const itemData = {
        name: document.getElementById('input-name').value.trim() || 'Khách không tên',
        phone: document.getElementById('input-phone').value.trim() || '',
        date: document.getElementById('input-date').value || window.currentSelectedDate,
        time: document.getElementById('input-time').value || '09:00',
        service: document.getElementById('input-service').value.trim() || 'Dịch vụ Nail',
        note: document.getElementById('input-note').value.trim() || ''
      };

      try {
        if (docId) {
          await updateDoc(doc(db, "appointments", docId), itemData);
        } else {
          await addDoc(appointmentsCol, itemData);
        }
        closeModal();
      } catch (err) {
        alert('Lỗi lưu dữ liệu: ' + err.message);
      }
    });

    // Xoá Lịch
    window.deleteItem = async function(docId) {
      if (confirm('Bạn có chắc chắn muốn xoá lịch hẹn này?')) {
        try {
          await deleteDoc(doc(db, "appointments", docId));
        } catch (err) {
          alert('Không thể xoá lịch!');
        }
      }
    };
  </script>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo-title">SỔ LỊCH NAIL</div>
    <div class="search-icon">🔍</div>
  </header>

  <!-- BANNER NGÀY -->
  <div class="date-banner">
    <div class="big-day" id="banner-day-num">--</div>
    <div>
      <div class="date-details" id="banner-day-name">Thứ --</div>
      <div class="sub-date" id="banner-month-year">Tháng --, ----</div>
    </div>
  </div>

  <!-- TAB NAVIGATION -->
  <div class="tab-nav">
    <div class="tab-item active" onclick="switchTab('day')">Ngày</div>
    <div class="tab-item" onclick="switchTab('week')">Tuần</div>
    <div class="tab-item" onclick="switchTab('month')">Tháng</div>
  </div>

  <!-- BỌC ĐIỀU HƯỚNG NGÀY -->
  <div class="day-nav">
    <button class="nav-btn" onclick="changeDate(-1)">❮</button>
    <div class="current-view-title" id="view-title">--/--</div>
    <button class="btn-today" onclick="goToday()">Hôm nay</button>
    <button class="nav-btn" onclick="changeDate(1)">❯</button>
  </div>

  <!-- DANH SÁCH LỊCH HẸN -->
  <div class="calendar-content" id="calendar-content">
    <div class="empty-state">
      <h3>Chưa có lịch hẹn</h3>
      <p>Bấm "+ Khách mới" để thêm lịch cho ngày này</p>
    </div>
  </div>

  <!-- NÚT BẤM THÊM KHÁCH MỚI GÓC DƯỚI -->
  <button class="btn-float-add" onclick="openModal()">
    <span>+</span> Khách mới
  </button>

  <!-- MODAL / FORM NHẬP LIỆU GIAO DIỆN MẪU -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <div class="drag-handle"></div>
      <div class="modal-title" id="modal-form-title">Thêm khách hẹn</div>

      <form id="modal-form">
        <input type="hidden" id="editing-id" value="">

        <div class="form-group">
          <label>Tên khách</label>
          <input type="text" id="input-name" placeholder="Ví dụ: Maria" oninput="handleAIInput(this.value)">
          <div class="hint-text">Mẹo: bấm 🎙️ trên bàn phím iPhone để nói thay vì gõ</div>
        </div>

        <div class="form-group">
          <label>Số điện thoại</label>
          <input type="text" id="input-phone" placeholder="612 123 456">
        </div>

        <div class="form-row form-group">
          <div class="form-col">
            <label>Ngày</label>
            <input type="date" id="input-date">
          </div>
          <div class="form-col">
            <label>Giờ</label>
            <input type="time" id="input-time">
          </div>
        </div>

        <div class="form-group">
          <label>Dịch vụ</label>
          <input type="text" id="input-service" placeholder="Refill Acrylic + French">
        </div>

        <div class="form-group">
          <label>Ghi chú</label>
          <textarea id="input-note" rows="2" placeholder="Ghi chú thêm..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-modal-cancel" onclick="closeModal()">Huỷ</button>
          <button type="submit" class="btn-modal-save">Lưu lịch hẹn</button>
        </div>
      </form>
    </div>
  </div>

<script>
  let selectedDate = new Date();
  window.currentSelectedDate = formatDateStr(selectedDate);

  function formatDateStr(d) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function updateHeaderBanner() {
    const daysName = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
    document.getElementById('banner-day-num').innerText = selectedDate.getDate();
    document.getElementById('banner-day-name').innerText = daysName[selectedDate.getDay()];
    document.getElementById('banner-month-year').innerText = `Tháng ${selectedDate.getMonth() + 1}, ${selectedDate.getFullYear()}`;
    
    const dayShort = selectedDate.getDay() === 0 ? 'CN' : `T${selectedDate.getDay() + 1}`;
    document.getElementById('view-title').innerText = `${dayShort}, ${selectedDate.getDate()}/${selectedDate.getMonth() + 1}`;
    
    window.currentSelectedDate = formatDateStr(selectedDate);
    renderAppointments();
  }

  function changeDate(days) {
    selectedDate.setDate(selectedDate.getDate() + days);
    updateHeaderBanner();
  }

  function goToday() {
    selectedDate = new Date();
    updateHeaderBanner();
  }

  function renderAppointments() {
    const container = document.getElementById('calendar-content');
    const targetDate = window.currentSelectedDate;

    const list = (window.globalAppointments || []).filter(item => item.date === targetDate);

    if (list.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <h3>Chưa có lịch hẹn</h3>
          <p>Bấm "+ Khách mới" để thêm lịch cho ngày này</p>
        </div>`;
      return;
    }

    container.innerHTML = list.map(item => `
      <div class="appt-card">
        <div>
          <span class="appt-time">⏰ ${item.time}</span>
          <div class="appt-name">${item.name} ${item.phone ? `- <span class="appt-phone">${item.phone}</span>` : ''}</div>
          <div class="appt-service">💅 ${item.service} ${item.note ? `| 📝 ${item.note}` : ''}</div>
        </div>
        <div class="appt-actions">
          <button class="btn-edit-act" onclick="editItem('${item.docId}')">Sửa</button>
          <button class="btn-del-act" onclick="deleteItem('${item.docId}')">Xoá</button>
        </div>
      </div>
    `).join('');
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
    event.target.classList.add('active');
  }

  // MODAL FUNCTIONS
  function openModal() {
    document.getElementById('modal-form').reset();
    document.getElementById('editing-id').value = '';
    document.getElementById('input-date').value = window.currentSelectedDate;
    document.getElementById('input-time').value = "09:00";
    document.getElementById('modal-form-title').innerText = "Thêm khách hẹn";
    document.getElementById('modal-overlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('active');
  }

  window.editItem = function(docId) {
    const item = window.globalAppointments.find(a => a.docId === docId);
    if (!item) return;

    document.getElementById('editing-id').value = item.docId;
    document.getElementById('input-name').value = item.name;
    document.getElementById('input-phone').value = item.phone || '';
    document.getElementById('input-date').value = item.date;
    document.getElementById('input-time').value = item.time;
    document.getElementById('input-service').value = item.service;
    document.getElementById('input-note').value = item.note || '';

    document.getElementById('modal-form-title').innerText = "Chỉnh sửa lịch hẹn";
    document.getElementById('modal-overlay').classList.add('active');
  };

  // AI TỰ ĐIỀN THÔNG TIN KHI GÕ/NÓI VÀO TÊN KHÁCH
  function handleAIInput(val) {
    if (!val || val.length < 8) return;
    
    // Tự động tách Số điện thoại nếu nói cả câu
    const phoneMatch = val.match(/(0\d{8,10}|\d{3}\s\d{3}\s\d{3})/);
    if (phoneMatch) {
      document.getElementById('input-phone').value = phoneMatch[0];
    }

    // Tự động tách Giờ
    const timeMatch = val.match(/(\d{1,2}(?:[:h]\d{2}|h)?)/i);
    if (timeMatch && timeMatch[0].length >= 2) {
      let t = timeMatch[0].toLowerCase().replace('h', ':');
      if (!t.includes(':')) t += ':00';
      const parts = t.split(':');
      const formattedTime = `${parts[0].padStart(2, '0')}:${(parts[1] || '00').padStart(2, '0')}`;
      document.getElementById('input-time').value = formattedTime;
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    updateHeaderBanner();
  });
</script>

</body>
</html>
